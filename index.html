function excelSerial(ms){

function excelBirthday(value){

 if(!Number.isFinite(+date)||date.toISOString().slice(0,10)!==value)return '';

function excelText(value){

  .replace(/[\u0000-\u0008\u000B-\u001F\uFFFE\uFFFF]/g,ch=>'_x'+ch.charCodeAt(0).toString(16).toUpperCase().padStart(4,'0')+'_')
  .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
}
function excelCell(row,prefix,ref,value){
 const cell=new RegExp('(<'+prefix+'c r="'+ref+'"(?: s="\\d+")?)(?: [^>]*?)?(?:\\s*/>|>[\\s\\S]*?</'+prefix+'c>)');
 if(!cell.test(row))throw Error('Excel 模板字段缺失。');
 if(typeof value==='number')return row.replace(cell,(_,tag)=>tag+'><'+prefix+'v>'+value+'</'+prefix+'v></'+prefix+'c>');

 if(value.length>32767)throw Error('有一项客户资料超过 Excel 单格可容纳的长度，缩短后可重试。');

 return row.replace(cell,(_,tag)=>tag+' t="inlineStr"><'+prefix+'is><'+prefix+'t xml:space="preserve">'+excelText(value)+'</'+prefix+'t></'+prefix+'is></'+prefix+'c>');

function excelEndRanges(xml,last){

function excelSheet(xml,sheet,last,editRow){

function openModal(dialog,opener=document.activeElement){
 if(dialog.open)return;

 const originPage=document.body.dataset.page;
 if(!modalLayers.size){
   modalScroll={x:scrollX,y:scrollY};

   document.body.setAttribute('data-modal-locked','');
 }
 const previousSession=modalLayers.get(dialog);
 modalLayers.set(dialog,release);
 function release(event){
   if(modalLayers.get(dialog)!==release){
     dialog.removeEventListener('close',release);
     return;
   }
   if(event&&dialog.open)return;
   dialog.removeEventListener('close',release);
   modalLayers.delete(dialog);
   if(!modalLayers.size){
     document.body.removeAttribute('data-modal-locked');
     document.body.style.removeProperty('--modal-scroll-top');
     window.scrollTo({left:modalScroll.x,top:modalScroll.y,behavior:'instant'});
     modalScroll=null;
   }
   if(!event)return;
   let target=opener?.isConnected&&opener!==document.body?opener:null;
   if(!target&&originPage===document.body.dataset.page){
     const row=rowId?[...document.querySelectorAll('#rows [data-row-id]')].find(item=>item.dataset.rowId===rowId):null;
     target=row?.querySelector('button')||document.querySelector('#add:not([hidden])');
   }
   if(target&&document.activeElement!==target)target.focus({preventScroll:true});
 }
 try{dialog.showModal()}catch(error){
   if(previousSession)modalLayers.set(dialog,previousSession);else release();
   throw error;
 }
 if(modalLayers.size===1&&(navFrame||navTimer)){
   cancelPendingNavigation();
   markNav(page);
 }
 dialog.addEventListener('close',release);
}

 const options=[];
 const cycle=field==='销售循环';
 if(cycle){
   let requested=null;
   const onEntry=e=>((trigger.contains(e.target)||caption.contains(e.target))&&!trigger.disabled);
   wrap.addEventListener('pointerdown',e=>{
     if(onEntry(e)&&e.isPrimary&&e.button===0)requested=!targetOpen;
   },true);
   wrap.addEventListener('pointercancel',()=>{requested=null});
   wrap.addEventListener('click',e=>{
     if(!onEntry(e))return;
     e.stopPropagation();
     const open=e.detail>0&&requested!==null?requested:!targetOpen;
     requested=null;toggle(open);
     if(!open)trigger.focus({preventScroll:true});
   },true);

 let targetOpen=false,motion=null;
 const topLayer=cycle&&typeof menu.showPopover==='function';
 if(topLayer)menu.setAttribute('popover','manual');
 let geometryListeners=null,menuFrame=0;
 function writeMenuStyle(name,value){
   if(menu.style[name]!==value)menu.style[name]=value;
 }
 function scheduleMenuPlacement(){
   if(menuFrame||!targetOpen)return;
   menuFrame=requestAnimationFrame(()=>{menuFrame=0;if(targetOpen)placeMenu()});
 }
 function placeMenu(){
   const rect=trigger.getBoundingClientRect(),view=window.visualViewport;
   const y=view?.offsetTop||0, height=view?.height||innerHeight;
   const above=Math.max(0,rect.top-y-8),below=Math.max(0,y+height-rect.bottom-8);
   const up=below<240&&above>below;
   writeMenuStyle('maxHeight',Math.min(256,up?above:below)+'px');
   writeMenuStyle('width',rect.width+'px');
   writeMenuStyle('left',(topLayer?rect.left:trigger.offsetLeft)+'px');
   const start=topLayer?rect.top:trigger.offsetTop;
   writeMenuStyle('top',(up?start-menu.offsetHeight-4:start+rect.height+4)+'px');
   const side=up?'above':'below';if(menu.dataset.side!==side)menu.dataset.side=side;
 }
 function animateCycle(open){
   if(open===targetOpen)return;
   targetOpen=open;
   const hidden=menu.hidden;
   function finish(){
     if(!targetOpen){if(topLayer&&menu.matches(':popover-open'))menu.hidePopover();menu.hidden=true;geometryListeners?.abort()}
     motion=null;
   }
   if(open){
     menu.style.visibility='hidden';
     menu.hidden=false;
     try{
       if(topLayer&&!menu.matches(':popover-open'))menu.showPopover();
       placeMenu();
     }finally{menu.style.removeProperty('visibility')}
     geometryListeners?.abort();geometryListeners=new AbortController();
     const opts={passive:true,signal:geometryListeners.signal};
     wrap.closest('#fields').addEventListener('scroll',scheduleMenuPlacement,opts);
     window.addEventListener('resize',scheduleMenuPlacement,opts);
     window.visualViewport?.addEventListener('resize',scheduleMenuPlacement,opts);
     window.visualViewport?.addEventListener('scroll',scheduleMenuPlacement,opts);
     menu.closest('dialog').addEventListener('close',()=>{
       geometryListeners?.abort();
       cancelAnimationFrame(menuFrame);menuFrame=0;
       motion?.cancel();targetOpen=false;menu.hidden=true;menu.inert=true;
       if(topLayer&&menu.matches(':popover-open'))menu.hidePopover();
     },{once:true,signal:geometryListeners.signal});
   }
   menu.style.transformOrigin=menu.dataset.side==='above'?'center bottom':'center top';
   const closed={opacity:0,transform:'translateY('+(menu.dataset.side==='above'?4:-4)+'px) scaleY(.985)'};
   const style=getComputedStyle(menu);
   const from=hidden?closed:{opacity:style.opacity,transform:style.transform};
   motion?.cancel();menu.inert=!open;
   if(matchMedia('(prefers-reduced-motion: reduce)').matches){finish();return}
   const animation=menu.animate([from,open?{opacity:1,transform:'none'}:closed],{duration:open?160:100,easing:'cubic-bezier(.22,.68,.25,1)'});
   motion=animation;
   animation.finished.then(()=>{if(motion===animation)finish()},()=>{});
 }

 function sync(){

 }
 for(const [i,o] of Array.from(select.options).entries()){
  const b=button(o.value||o.text==="无"?o.text:"暂不填写",()=>{select.selectedIndex=i;sync();toggle(false);trigger.focus({preventScroll:cycle});select.dispatchEvent(new Event("change",{bubbles:true}))},menu);
  b.setAttribute('role','option');b.tabIndex=-1;options.push(b);

 };

}

function incomeEditor(input,record){
 const old=String(record.年收入||'').trim();
 const match=old.match(/^(HK\$|US\$|CNY|RMB|HKD|USD|人民币|港币|美元|[¥￥$])?\s*([\d,]+(?:\.\d+)?)\s*(CNY|RMB|HKD|USD|人民币|港币|美元)?$/i);
 const currency=(match&&(match[1]||match[3])||'').toUpperCase();
 const originalCurrency=record.收入币种||(/HK|港币/.test(currency)?'HKD':/US|美元|^\$$/.test(currency)?'USD':'CNY');
 const label=input.parentElement,wrap=node('div');wrap.className='income-row';label.replaceWith(wrap);
 const heading=node('span','财务状况',wrap),holder=node('label',null,wrap),select=node('select',null,holder);
 node('small','年收入',heading).className='income-caption';
 for(const [code,symbol] of [['CNY','¥'],['HKD','HK$'],['USD','US$']])select.add(new Option(symbol,code));
 select.value=originalCurrency;glassChoiceMenu(select,'币种');
 wrap.append(input);input.setAttribute('aria-label','财务状况金额');input.inputMode='decimal';input.placeholder='输入金额';
 input.value=record.收入金额??(match?match[2].replace(/,/g,''):'');
 if(old&&!match&&record.收入金额==null){const note=node('small','原记录：'+old,wrap);note.className='income-original'}
 function grouped(value){
   const raw=String(value).replace(/,/g,'');
   return /^\d*(?:\.\d*)?$/.test(raw)?raw.replace(/^\d+/,digits=>digits.replace(/\B(?=(\d{3})+(?!\d))/g,',')):value;
 }
 input.value=grouped(input.value);
 input.oninput=event=>{
   if(event.isComposing)return;
   const oldValue=input.value,formatted=grouped(oldValue);
   if(oldValue===formatted)return;
   const count=oldValue.slice(0,input.selectionStart).replace(/,/g,'').length;
   let pos=0,seen=0;
   while(pos<formatted.length&&seen<count){if(formatted[pos++]!==',')seen++}
   input.value=formatted;input.setSelectionRange(pos,pos);
 };
 input.pattern='[0-9]{1,3}(,[0-9]{3})*([.][0-9]+)?';input.title='请输入非负金额，例如 150,000.50';

 return item=>{
   const amount=input.value.trim();
   if(!amount&&old&&!match&&record.收入金额==null){item.年收入=old;return}
   item.收入金额=amount.replace(/,/g,"");item.收入币种=select.value;
   item.年收入=amount?select.selectedOptions[0].text+' '+amount:'';
 };
}

function addressOptions(region,data){
 const city=data.城市||'',district=data.区或县||'';
 if(region==='中国内地'){
   const province=Object.keys(mainlandAreas).find(p=>p===data.省或直辖市||data.省或直辖市&&p.startsWith(data.省或直辖市));
   const cities={};
   for(const [name,areas] of Object.entries(mainlandAreas[province]||{})){
     const key=['市辖区','县'].includes(name)?province:name;
     cities[key]=[...(cities[key]||[]),...areas];
   }
   return {'城市':Object.keys(cities),'区或县':cities[city]||[]};
 }
 if(region==='中国台湾'){
   const normalize=s=>s.replace(/臺/g,'台').replace(/縣/g,'县').replace(/東/g,'东').replace(/園/g,'园').replace(/義/g,'义').replace(/蘭/g,'兰').replace(/門/g,'门').replace(/連/g,'连').replace(/雲/g,'云');
   const entry=taiwanAreas.find(x=>normalize(x.CityName)===normalize(city));
   return {'区或县':entry?entry.AreaList.map(a=>a.AreaName):[]};
 }
 return {};
}

function regionFields(controls,container,onAddressChange){
 const country=controls.国家或地区,original=country.value;

  for(const {wrap,label,select} of menus){wrap.replaceWith(label);label.append(select);select.hidden=false}menus=[];
  const local=regions[current],foreign=current==='外国';

   label.hidden=!!omit;label.style.display=omit?'none':'';
   if(key==='国家或地区')label.firstChild.nodeValue='国家名称';
  }
  let after=anchor;for(const key of ["省或直辖市","城市","区或县"]){if(!Object.hasOwn(options,key))continue;const label=labels.get(key),select=controls[key];after.after(label);const wrap=glassChoiceMenu(select,key);menus.push({wrap,label,select});after=wrap;wrap.querySelector("button").disabled=select.options.length===1;if(key!=="区或县")select.onchange=()=>{const draft=read();draft.区或县="";if(key==="省或直辖市")draft.城市="";render(draft);menus.find(m=>m.select===controls[key])?.wrap.querySelector("button")?.focus();};}

 }
 const data=read();mode.value=initial;
 if(!initial&&addressParts.slice(1).some(k=>data[k])){current='中国内地';mode.value=current}

   const finish=()=>{details.open=opening;details.removeAttribute('data-closing');animation=null};

const lunarFormatter=new Intl.DateTimeFormat("en-u-ca-chinese",{year:"numeric",timeZone:"UTC"});
function birthFacts(iso,now=new Date()){ 
 const [year,month,day]=iso.split('-').map(Number);
 const date=new Date(iso+'T12:00:00Z');
 const lunarYear=Number(lunarFormatter.formatToParts(date).find(p=>p.type==='relatedYear').value);
 const age=now.getFullYear()-year-Number(now.getMonth()+1<month||(now.getMonth()+1===month&&now.getDate()<day));
 return {age,animal:'鼠牛虎兔龙蛇马羊猴鸡狗猪'[(lunarYear-4)%12]};
}

  return '';

   const left=keys.get(a),right=keys.get(b);

}
