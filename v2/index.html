  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px 16px;
  margin-block: 0 12px;
  padding: 8px 12px;
  border: 1px solid var(--appearance-line);
  border-radius: 14px;
  background: var(--appearance-surface);
}
.trial-banner button,
.trial-section-link { min-height: 44px; }
.trial-section-link { grid-column: 1 / -1; justify-self: start; }

html:is([data-device="iphone"], [data-device="phone"]) {
  --phone-nav-bottom: max(4px, env(safe-area-inset-bottom));
  --phone-nav-space: calc(var(--phone-nav-height, 56px) + var(--phone-nav-bottom) + 16px);
  scroll-padding-bottom: var(--phone-nav-space);
}
html:is([data-device="iphone"], [data-device="phone"]) body[data-page] > main {
  padding-bottom: var(--phone-nav-space);
}
html:is([data-device="iphone"], [data-device="phone"]) .studio-brand > .studio-clock {
  position: static;
  inset: auto;
  transform: none;
  margin: 0;
  padding: 0;
}
html:is([data-device="iphone"], [data-device="phone"]) body > nav {
  position: fixed;
  inset: auto max(8px, env(safe-area-inset-right)) var(--phone-nav-bottom) max(8px, env(safe-area-inset-left));
  z-index: 10;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 2px;
  padding: 6px;
  align-items: stretch;
  overflow: hidden;
}
html:is([data-device="iphone"], [data-device="phone"]) body > nav > button {
  grid-row: 1;
  width: 100%;
  min-width: 0;
  min-height: 44px;
  margin: 0;
  padding: 4px 2px;
  white-space: normal;
  overflow-wrap: anywhere;
  font-size: 14px;
  text-align: center;
}

function changedSinceRead(storage         , storageKey        , previous               )          {
  return storage.getItem(storageKey) !== previous;
}

function writeSnapshot(storage         , storageKey        , data        )         {
  const serialized = JSON.stringify(data);
  storage.setItem(storageKey, serialized);
  return serialized;
}

function withWorkspaceLock   (storageKey        , operation         )             {
  const locks = typeof navigator !== 'undefined' && navigator.locks;
  if (locks) return locks.request(storageKey + ':write', operation);
  return Promise.resolve().then(operation);
}

/* Business rules used by the offline workspace and online trial. */
const today=()=>new Date().toLocaleDateString('sv-SE');

const addressParts=["国家或地区","省或直辖市","城市","区或县","街道或乡镇","道路或小区","门牌号","楼栋及房号"];
function clientFieldLabel(key){return ({'职业&行业':'职业与行业','与香港的联系':'香港的关系','年收入':'财务状况'})[key]||key}
const coreClientFields=['家庭结构','职业&行业','与香港的联系','年收入'];
const extraClientFields=["婚姻状况",...coreClientFields,"兴趣爱好","生肖"];
const schema={client:["姓名","性别","年龄","电话","邮箱",'公司',...addressParts,...extraClientFields,'备注'],deal:['机会名称','客户','产品','需求','预算','币种','销售阶段','状态','备注'],task:['事项','客户','日期','地点','状态','备注'],log:['跟进摘要','客户','日期','渠道','备注'],meet:['会面名称','客户','日期','时间','结束时间','地点','目的','状态']};
const choices={婚姻状况:["","未婚","已婚","离异","丧偶","其他"],生肖:["","鼠","牛","虎","兔","龙","蛇","马","羊","猴","鸡","狗","猪"],币种:['CNY','HKD','USD'],销售阶段:['初步接触','需求分析','方案建议','洽谈签约'],渠道:['电话','微信','邮件','会面'],deal:['进行中','暂缓','已签发','未成交'],task:["触达客户","KYC","Open Case","出方案","方案讲解","答疑+流程介绍","敲定行程","安排来港","认证+签单+开户","客户维护+转介绍"],meet:['已安排','已完成','已取消']};
const stages=[
 ['获客与洞察','#007AFF',['接触客户','KYC'],'判断是否值得进入正式销售流程','建立联系、识别需求、梳理家庭与资产保障背景、判断意愿与适配度','有效触达率、KYC完成率、合格客户率、进入Open Case率'],
 ['立案与设计','#AF52DE',['Open Case','出方案'],'将需求转化为可比较、可执行的方案','正式立案、明确目标与约束、组合产品与账户结构、复核方案','Open Case及时率、首版方案完成时长、方案复核通过率、返工率'],
 ['沟通与推进','#30B0C7',['方案讲解','解答疑问＋流程介绍'],'从听懂方案走向愿意行动','解释价值、比较方案、处理异议、说明风险与流程、确认下一步','方案讲解完成率、疑问闭环率、二次沟通率、进入行程敲定率'],
 ['成交与落地','#FF9500',['敲定行程','安排来港','认证＋签单＋开户'],'将购买意向转为签约、认证与开户','确认行程、准备材料、安排来港、认证签单开户、跟进缺件','行程确认率、到港率、签单完成率、开户完成率、平均成交周期'],

const oldSteps=choices.task;
choices.task=stages.flatMap(stage=>stage[2]);
function stepNumber(label){return Math.max(oldSteps.indexOf(label),choices.task.indexOf(label))+1}
function stageOf(step){return stages.find(stage=>stage[2].includes(choices.task[step-1]))}
function openCycle(t){return !t.completedAt&&(stepNumber(t.状态)>0||['待跟进','待设置'].includes(t.状态))}
function stepLabel(step){return choices.task[step-1]||'待设置'}

function initialClientStep(record,quickEntry){

}

function fitCycles(data){
 const evidence=new Map();
 for(const t of data.task){
   if(!openCycle(t)){
     if(t.completedCycle==null)t.completedCycle=stepNumber(t.状态)?stepLabel(stepNumber(t.状态)):t.状态==='已完成'?'未记录':t.状态||'未记录';
     continue;
   }
   const step=stepNumber(t.状态);
   if(!step&&t.状态!=='待设置')continue;
   const id=String(t.客户);
   if(!evidence.has(id))evidence.set(id,[]);
   evidence.get(id).push({step,source:t.事项||'跟进事项',date:t.日期||''});
 }
 for(const c of data.client){

   c.cycleVersion=1;
 }
}

function normalizeStore(raw){

function validateStore(parsed){
 if(!parsed||typeof parsed!=='object'||!Array.isArray(parsed.client))throw Error('invalid client store');
 for(const name of ['client','deal','task','log','meet','history']){
   if(!(name in parsed))parsed[name]=[];
   if(!Array.isArray(parsed[name])||parsed[name].some(row=>!row||typeof row!=='object'||Array.isArray(row)))throw Error('invalid collection');
   if(name!=='history'){
     const ids=new Set();
     for(const row of parsed[name]){
       const id=String(row.id);
       if((typeof row.id!=='string'&&typeof row.id!=='number')||!id.trim()||ids.has(id))throw Error('invalid record id');
       ids.add(id);
     }
   }
 }
 fitCycles(parsed);return parsed;
}

const customerAgeLimit=120;

function normalizeCustomerAge(value){

}
function customerAgeError(value){

}
function customerBirthdayAge(birthday,currentDate){
 const [year,month=0,day=0]=String(birthday).split('-').map(Number);
 const [currentYear,currentMonth,currentDay]=currentDate.split('-').map(Number);
 return currentYear-year-Number(currentMonth<month||(currentMonth===month&&currentDay<day));
}
function manualCustomerAge(record){

}
function customerAgeAt(record,currentDate=today(),manualAge=manualCustomerAge(record)){

 if(/^\d{4}-\d{2}-\d{2}$/.test(birthday)&&birthday<=currentDate){
  return customerBirthdayAge(birthday,currentDate);
 }
 return manualAge??(/^\d{4}$/.test(year)&&year<=currentDate.slice(0,4)?customerBirthdayAge(year,currentDate):'');
}
function customerBirthdayPreview([year,month,day],currentDate){
 if(!year)return '选择年份查看年龄';
 const complete=Boolean(month&&day);
 const birthday=complete?[year,month.padStart(2,'0'),day.padStart(2,'0')].join('-'):'';
 if(birthday>currentDate)return '出生日期晚于今天';
 const age=customerBirthdayAge(birthday||year,currentDate);
 const invalid=customerAgeError(String(age));
 return invalid||(complete?'':'约 ')+age+' 岁';
}

function detectDevice(agent, platform, touches){
  if (/iPhone|iPod/i.test(agent)) return 'iphone';
  if (/iPad/i.test(agent) || (platform === 'MacIntel' && touches > 1)) return 'ipad';
  if (/Android/i.test(agent)) return /Mobile/i.test(agent) ? 'phone' : 'tablet';
  return 'desktop';
}

function initializeTrialPressFeedback() {
  const actions = 'button, summary, a[href], [role="button"], [role="option"], [role^="menuitem"]';
  let press;
  function clear() {
    press?.control.removeAttribute('data-trial-pressed');
    press = undefined;
  }
  document.addEventListener('pointerdown', event => {
    if (!event.isPrimary || event.pointerType === 'mouse') return;
    clear();
    const control = event.target.closest(actions);
    if (!control || control.matches(':disabled, [aria-disabled="true"]')) return;
    press = {control, id:event.pointerId, x:event.clientX, y:event.clientY};
    control.setAttribute('data-trial-pressed', '');
  }, {passive:true, capture:true});
  document.addEventListener('pointermove', event => {
    if (press?.id !== event.pointerId) return;
    const hit = document.elementFromPoint(event.clientX, event.clientY);
    if (!press.control.contains(hit) || Math.hypot(event.clientX - press.x, event.clientY - press.y) > 8) clear();
  }, {passive:true, capture:true});
  for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) {
    document.addEventListener(type, event => {
      if (press?.id === event.pointerId) clear();
    }, {passive:true, capture:true});
  }
  window.addEventListener('blur', clear);
}

function excelEndRanges(xml,last){

function excelSheet(xml,sheet,last,editRow){

function loadHostedExcelLibrary(url, signal) {
 if(typeof globalThis.JSZip?.loadAsync==='function')return Promise.resolve(globalThis.JSZip);
 return new Promise((resolve,reject)=>{
  const script=document.createElement('script');
  script.src=url;
  const finish=error=>{
   signal.removeEventListener('abort',stop);
   script.remove();
   if(error)reject(error);
   else resolve(globalThis.JSZip);
  };
  const stop=()=>finish(new Error('Excel library request stopped'));
  signal.addEventListener('abort',stop,{once:true});
  script.onload=()=>finish(typeof globalThis.JSZip?.loadAsync==='function'?null:new Error('Excel library unavailable'));
  script.onerror=()=>finish(new Error('Excel library request failed'));
  document.head.append(script);
 });
}

async function loadHostedExcelZip(libraryUrl,templateUrl) {
 const controller=new AbortController();
 const timeout=setTimeout(()=>controller.abort(),15000);
 try {
  const [library,template]=await Promise.all([
   loadHostedExcelLibrary(libraryUrl,controller.signal),
   fetch(templateUrl,{signal:controller.signal}).then(response=>{
    if(!response.ok)throw new Error('Excel template request failed');
    return response.arrayBuffer();
   }),
  ]);
  return await library.loadAsync(template);
 } finally {
  clearTimeout(timeout);
  controller.abort();
 }
}

 const wasLinked=linkedFollowup;linkedFollowup=null;

 function commit(){cancelAnimationFrame(navFrame);clearTimeout(navTimer);if(document.querySelector('dialog:modal')){markNav(page);return}go(target)}
 navFrame=requestAnimationFrame(()=>{navFrame=requestAnimationFrame(commit)});
 navTimer=setTimeout(commit,100);
}
function render(){document.body.dataset.page=page;document.body.classList.toggle("home",page==="home");const nav=$('nav');
 if(!nav.children.length){

   for(const [key,label] of Object.entries(names)){if(["deal","meet","history"].includes(key)||(phoneLayout&&key==='log'))continue;const b=button(label,()=>navigate(key),nav);b.dataset.page=key;if(key==="backup"&&!phoneLayout){const group=node("div",null,nav);group.className="backup-nav-group";group.append(document.querySelector(".studio-clock"),b)}}
   initializeTrialNavigation(nav);
   nav.addEventListener("scroll",positionGlass,{passive:true});window.addEventListener("resize",positionGlass); if(window.ResizeObserver)new ResizeObserver(positionGlass).observe(nav);
   if(document.fonts)document.fonts.ready.then(positionGlass);
 }
 markNav(page);
 $('h1').textContent=names[page];renderStageHelpEntry();renderPageActions();const add=$('#add'),k=page==='home'?'client':page;add.hidden=!schema[k];add.textContent='＋ 新增'+names[k];add.onclick=()=>editor(k);if(page==='home'){add.textContent='会后速记';add.onclick=()=>showQuickClientEntry(add);add.setAttribute('aria-haspopup','dialog')}else add.removeAttribute('aria-haspopup');
 const metrics=$('#metrics');metrics.replaceChildren();metrics.className=page==='home'?'metrics':'';if(page==='home')for(const [label,num] of [['客户数量',state.client.length],['待跟进事项',state.task.filter(isPendingTask).length]]){const m=node('div',label,metrics);m.className='metric';node('b',String(num),m)}
 renderClientTools();const bar=$('#filters');bar.replaceChildren();if(schema[page]){const wrap=node('div',null,bar);wrap.className='search-field';const q=node('input',null,wrap);q.id='search';q.type='search';q.placeholder='搜索'+names[page];q.setAttribute('aria-label',q.placeholder);q.value=query;const clear=button('×',()=>{q.value='';q.oninput();q.focus()},wrap);clear.className='clear-query';clear.hidden=!query;clear.setAttribute('aria-label','清空关键词');let pending=0;q.oninput=()=>{query=q.value;clear.hidden=!query;cancelAnimationFrame(pending);pending=requestAnimationFrame(()=>{if(q.isConnected)drawRows()})};const opts=page==='meet'?choices.meet:null;if(opts){const s=node('select',null,bar);s.setAttribute('aria-label','状态筛选');s.add(new Option(page==='client'?'未成交':'全部状态',''));for(const v of opts)s.add(new Option(v,v));s.value=filter;s.onchange=()=>{filter=s.value;drawRows()}}}drawRows()}

$('dialog').addEventListener('keydown',event=>{
 const dialog=event.currentTarget,source=event.target;
 if(dialog.dataset.editor!=='client'||event.defaultPrevented||event.isComposing||event.altKey||event.ctrlKey||event.metaKey||event.shiftKey)return;
 const key=event.key;
 if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(key))return;
 if(source.closest('.gender-menu,.date-wheel,.task-calendar,.client-search-panel'))return;
 const menuTrigger=source.closest('.gender-control>button');
 if(menuTrigger&&menuTrigger.getAttribute('aria-expanded')==='true')return;
 const horizontal=key==='ArrowLeft'||key==='ArrowRight',direction=key==='ArrowLeft'||key==='ArrowUp'?-1:1;
 if(source.matches('input,textarea')&&source.value){
   if(source.tagName==='TEXTAREA'&&!horizontal)return;
   if(horizontal){try{
     const start=source.selectionStart,end=source.selectionEnd;
     if(start!==null&&(start!==end||(direction<0?start>0:end<source.value.length)))return;
   }catch{}}
 }
 const current=source.getBoundingClientRect(),cx=current.left+current.width/2,cy=current.top+current.height/2;
 let best=null,lowest=Infinity;
 for(const target of dialog.querySelectorAll('button,input,select,textarea,summary,[tabindex="0"]')){
   if(target===source||target.disabled||target.tabIndex<0||!target.getClientRects().length||target.closest('.gender-menu,.date-wheel'))continue;
   if(target.closest('details:not([open])')&&target.tagName!=='SUMMARY')continue;
   const rect=target.getBoundingClientRect(),dx=rect.left+rect.width/2-cx,dy=rect.top+rect.height/2-cy;
   const ahead=direction*(horizontal?dx:dy);
   if(ahead<3)continue;
   if(horizontal&&Math.abs(dy)>Math.max(current.height,rect.height)*.55)continue;
   const score=ahead+(horizontal?Math.abs(dy)*3:Math.abs(dx)*.8);
   if(score<lowest){lowest=score;best=target}
 }
 if(best){event.preventDefault();event.stopPropagation();best.focus()}
},true);

const dayFormat=new Intl.DateTimeFormat('zh-CN',{dateStyle:'long'});
function refreshClock(){
 const now=new Date(),clock=document.getElementById('studio-clock'),value=dayFormat.format(now);
 if(clock.textContent!==value){clock.textContent=value;clock.dateTime=[now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-')}
}
function scheduleDate(){const changed=$("#studio-clock").dateTime!==today();refreshClock();if(changed&&page==="home")drawRows();const midnight=new Date();midnight.setHours(24,0,0,0);setTimeout(scheduleDate,midnight.getTime()-Date.now()+50)}
scheduleDate();document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshClock()});


let brandFrame=0;
function centerBrandInk(){if(!brandFrame)brandFrame=requestAnimationFrame(()=>{brandFrame=0;measureBrandInk()})}
function measureBrandInk(){
 const mark=document.querySelector('.monogram'),signature=mark.querySelector('.signature');
 const ctx=document.createElement('canvas').getContext('2d');
 if(!ctx)return;
 const outer=mark.getBoundingClientRect();
 const shift=parseFloat(signature.style.getPropertyValue('--ink-shift'))||0;
 let left=Infinity,right=-Infinity;
 const walker=document.createTreeWalker(signature,NodeFilter.SHOW_TEXT);
 while(walker.nextNode()){
   const text=walker.currentNode,style=getComputedStyle(text.parentElement);
   const range=document.createRange();range.selectNodeContents(text);
   const rect=range.getBoundingClientRect();
   ctx.font=style.fontStyle+' '+style.fontWeight+' '+style.fontSize+' '+style.fontFamily;
   ctx.textAlign='left';const metrics=ctx.measureText(text.data);
   left=Math.min(left,rect.left-metrics.actualBoundingBoxLeft);
   right=Math.max(right,rect.left+metrics.actualBoundingBoxRight);
 }
 const next=shift+(outer.left+outer.right-left-right)/2;
 if(Number.isFinite(next))signature.style.setProperty('--ink-shift',next.toFixed(2)+'px');
}
document.fonts.ready.then(centerBrandInk);window.addEventListener('resize',centerBrandInk);
if(window.ResizeObserver)new ResizeObserver(centerBrandInk).observe(document.querySelector('.signature'));




function applyGlassControl(control) {
 if(control.closest('nav,[data-glass-skip]'))return;
 if(!control.classList.contains('glass-control')){
  if(getComputedStyle(control).position==='static')control.classList.add('glass-static');
  control.classList.add('glass-control');
 }
 if(!control.querySelector(':scope > .glass-face')){
  const face=document.createElement('span');
  face.className='glass-face';
  face.setAttribute('aria-hidden','true');
  control.prepend(face);
 }
 // Keep existing elements in their layout slots, including grid-based editor controls.
 // Rewrap bare labels when a status or navigation change replaces the button text.
 for(const content of Array.from(control.childNodes)){
  if(content.nodeType!==Node.TEXT_NODE||!content.data.trim())continue;
  const label=document.createElement('span');
  label.className='glass-label';
  content.before(label);
  label.append(content);
 }
}
function applyGlassControls(root) {
 if(!(root instanceof Element))return;
 if(root.matches('button,summary'))applyGlassControl(root);
 root.querySelectorAll('button,summary').forEach(applyGlassControl);
}
applyGlassControls(document.body);
new MutationObserver(records=>{
 for(const record of records){
  if(record.target instanceof Element&&record.target.matches('button,summary'))applyGlassControl(record.target);
  record.addedNodes.forEach(applyGlassControls);
 }
}).observe(document.body,{childList:true,subtree:true});


const glassMotionPreference=matchMedia('(prefers-reduced-motion: reduce)');
const dialogMotions=new Map();
function animateGlassDialog(dialog,opening,bottom){
 const previous=dialogMotions.get(dialog);
 if(!opening&&previous?.closing)return;
 const styles=getComputedStyle(dialog);
 const resting={opacity:1,transform:'none'};
 const hidden={opacity:0,transform:bottom?'translateY(24px)':'translateY(5px) scale(.985)'};
 const from=opening?hidden:{opacity:styles.opacity,transform:styles.transform};
 previous?.animation.cancel();
 dialogMotions.delete(dialog);
 if(glassMotionPreference.matches||!dialog.animate){
  if(!opening)dialog.close();
  return;
 }
 const animation=dialog.animate([from,opening?resting:hidden],{duration:opening?160:100,easing:'ease-out'});
 const state={animation,closing:!opening};
 dialogMotions.set(dialog,state);
 const finish=()=>{
  if(dialogMotions.get(dialog)!==state)return;
  dialogMotions.delete(dialog);
  if(state.closing&&dialog.open)dialog.close();
 };
 animation.finished.then(finish,finish);
}
function openGlassDialog(dialog,{bottom=false}={}){
 if(dialog.open)return;
 dialog.showModal();
 dialog.addEventListener('close',()=>{
  const state=dialogMotions.get(dialog);
  dialogMotions.delete(dialog);
  state?.animation.cancel();
 },{once:true});
 animateGlassDialog(dialog,true,bottom);
}
function closeGlassDialog(dialog,{bottom=false}={}){
 if(dialog.open)animateGlassDialog(dialog,false,bottom);
}
glassMotionPreference.addEventListener('change',()=>{
 if(!glassMotionPreference.matches)return;
 for(const state of dialogMotions.values())state.animation.cancel();
});

const brandCube=document.querySelector('.brand-cube-hit');
const brandGlyph=brandCube.querySelector('img');
const brandHover=matchMedia('(any-hover:hover) and (any-pointer:fine)');
let reliefMotion,glyphTimer,brandPointer=null,pressOrigin=null;
function resetGlyph(){
 clearTimeout(glyphTimer);
 brandCube.removeAttribute('data-glyph-raised');
 reliefMotion?.cancel();
}
function raiseGlyph(){
 if(glassMotionPreference.matches)return;
 resetGlyph();
 glyphTimer=setTimeout(()=>{
  brandCube.setAttribute('data-glyph-raised','');
  reliefMotion=brandGlyph.animate([{scale:'1'},{scale:'1.02',offset:.39},{scale:'1'}],
   {duration:280,easing:'ease-in-out'});
 },70);
}
brandCube.addEventListener('pointerenter',event=>{
 if(event.pointerType!=='mouse'||!brandHover.matches)return;
 brandCube.setAttribute('data-mouse-hover','');
 raiseGlyph();
});
function resetBrand(){
 brandPointer=null;pressOrigin=null;
 brandCube.removeAttribute('data-mouse-hover');
 brandCube.removeAttribute('data-touch-press');
 resetGlyph();
}
brandCube.addEventListener('pointerdown',event=>{
 if(event.pointerType==='mouse'||!event.isPrimary)return;
 resetBrand();
 brandPointer=event.pointerId;
 pressOrigin=[event.clientX,event.clientY];
 brandCube.setAttribute('data-touch-press','');
 raiseGlyph();
});
brandCube.addEventListener('pointermove',event=>{
 if(event.pointerId===brandPointer&&Math.hypot(event.clientX-pressOrigin[0],event.clientY-pressOrigin[1])>8)resetBrand();
});
brandCube.addEventListener('pointerleave',resetBrand);
for(const type of ['pointerup','pointercancel','lostpointercapture']){
 brandCube.addEventListener(type,event=>{if(event.pointerId===brandPointer)resetBrand()});
}
glassMotionPreference.addEventListener('change',resetGlyph);
